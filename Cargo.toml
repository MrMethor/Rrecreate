[workspace]
resolver = "3"
members = ["clockwork/cpu", "clockwork/dos", "clockwork/cli", "ids", "rrc", "runtime", "examples/toy"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
# Clockwork's crates are GPL-2.0-or-later and say so themselves.
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde-big-array = "0.5"
cpu = { path = "clockwork/cpu" }
dos = { path = "clockwork/dos" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
