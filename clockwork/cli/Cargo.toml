[package]
name = "clockwork"
description = "Clockwork, a deterministic DOS PC: run headless, play in a window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "GPL-2.0-or-later"

[[bin]]
name = "clockwork"
path = "src/main.rs"

[dependencies]
cpu.workspace = true
dos.workspace = true
machine.workspace = true
minifb = "0.29"
tinyaudio = "2"
midir = "0.11"
gilrs = "0.11"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel"] }
# PNG screenshots (deflate in pure Rust, and the chunks' CRC).
flate2 = "1"
crc32fast = "1"

[lints]
workspace = true
