[package]
name = "cpu"
description = "Deterministic x86 CPU interpreter (real, protected and virtual-8086 mode) for Clockwork"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "GPL-2.0-or-later"

[dependencies]
serde.workspace = true
serde-big-array.workspace = true
# Transcendental functions that give the same bits on every host (x87 FSIN, FYL2X, ...).
libm = "0.2"

[dev-dependencies]
# Reads the gzipped SingleStepTests suites (examples/singlestep.rs).
flate2 = "1"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "code_asm"] }

[lints]
workspace = true
