[package]
name = "rrc"
description = "Rrecreate's toolkit: port repositories, knowledge, analysis, sessions and traces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "rrc"
path = "src/main.rs"

# Clockwork is driven through its protocol, never linked (DESIGN.md §3, D12).
[dependencies]
ids = { path = "../ids" }
# The codecs a port decodes the game's files with, so an extraction decodes as the port does (D103).
rrc-runtime = { path = "../runtime" }
serde.workspace = true
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
flate2 = "1"
crc32fast = "1"

[lints]
workspace = true
